[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-gym-core"
version = "1.0.0"
description = "Run, evaluate and optimize LLM agents with ReAPO; code for the paper Simplicity is Enough: ReAct Agents for Prompt Optimization."
readme = "README.md"
authors = [
    { name = "Andrei Dumitrescu" },
    { name = "Andrei C. Rusu" },
    { name = "Adrian Catalin Badea" },
    { name = "Bai Li" },
    { name = "Cosmin Maria" },
    { name = "Ion Anghelina" },
    { name = "Tomasz Lukasz Religa" },
    { name = "Dragos H Bobolea" },
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["reapo", "prompt-optimization", "agents", "langgraph", "evaluation", "llm", "react", "benchmark"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11.5,<3.14"
dependencies = [
    "langgraph>=0.2.70",
    "langchain-chroma>=0.2.1",
    # unstructured alone resolves a much older chromadb, whose on-disk schema differs.
    "chromadb>=1.5.0",
    "langchain-community>=0.3.3",
    "langchain-core>=0.3.34",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.6",
    "aiohttp>=3.14.3",
    "typing-extensions>=4.12.2",
    "ipython>=8.32.0",
    "jsonschema>=4.25.1",
    "tqdm>=4.66.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "openinference-instrumentation-langchain>=0.1.56",
    "opentelemetry-exporter-otlp-proto-common>=1.45.1",
    "hydra-core>=1.3.8",
    "pandas>=2.2.3",
    "protobuf>=4.25.0",
    "uipath-dev>=0.0.13",
    "pypdf>=6.21.4",
    "pillow>=13.0.0",
    "faiss-cpu>=1.13.2",
    "uipath>=2.10.19",
    "uipath-langchain-client[anthropic,azure,bedrock,fireworks,google,openai,vertexai]>=1.22.0,<1.23",
    "cryptography>=50.0.2,<51",
    "uipath-langchain>=0.18.51,<0.19",
    "mcp>=2.3.0,<3",
    "langmem>=0.0.30",
    "strictly-typed-pandas>=0.1.5",
    "seaborn>=0.13.2",
    "jinja2>=3.1.6",
    "scipy>=1.17.0",
    "statsmodels>=0.14.6",
    "nbconvert>=7.17.2",
    "mistune>=3.3.4,<4",
    "ipykernel>=7.4.0",  # the kernel nbconvert runs the --run_report notebook in
    "langchain-google-community>=3.0.5",
    "networkx>=3.6.1",
    "unstructured>=0.27.37",

    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "filelock>=4.2.1,<5",
    "soupsieve>=4,<5",
    "ddgs>=9.11.4",
    # Harness profile compatibility uses private helpers validated at this exact release.
    "deepagents==0.7.26",
    "rank-bm25>=0.2.2",
    # ReAPO resume: AsyncSqliteSaver checkpoints the optimizer's LangGraph thread.
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[project.scripts]
gym = "agents_gym_core.sdk.cli:main"

[project.optional-dependencies]
huggingface = [
    "langchain-huggingface>=0.1.0",
    "accelerate>=0.26.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "transformers>=5.19.0,<5.20",
    "huggingface-hub>=1.33.0,<2",
]
fireworks = [
    "langchain-fireworks>=0.2.0",
]
dspy = [
    "dspy>=3.0.0",
    # Publish the reviewed security range for non-uv installers too.
    "litellm>=1.109.0,<1.110",
    # HuggingFace datasets: the public-benchmark agents' init scripts build GEPA's splits from it.
    "datasets>=4.5.0",
    "bm25s>=0.3.3",
    "pystemmer>=3.0.0",
    "diskcache>=5.6.3",
    "ujson>=5.12.0",
    "nltk>=3.10.4",
    "syllapy>=0.8.0",
    "langdetect>=1.0.9",
    "emoji>=2.14.0",
    "immutabledict>=4.2.0",
    "absl-py>=2.0.0",
    "math-verify>=0.6.0",
    "lark>=1.2.0",
    "spacy>=3.8.0,<3.9",
    # IFBench loads it; installed from its GitHub release (see [tool.uv.sources]).
    "en-core-web-sm",
]
all = [
    "agents-gym-core[huggingface]",
    "agents-gym-core[fireworks]",
    "agents-gym-core[dspy]",
]
dev = [
    "packaging>=26.0,<27",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.15.0",
    "pyright>=1.1.391",
]

[project.urls]
Homepage = "https://github.com/UiPath/agents-gym-core"
Documentation = "https://github.com/UiPath/agents-gym-core/tree/main/docs"
Repository = "https://github.com/UiPath/agents-gym-core"
Issues = "https://github.com/UiPath/agents-gym-core/issues"

[tool.setuptools.packages.find]
where = ["src"]
# `gym init` writes the public benchmarks' eval sets and evaluators (gitignored); a wheel built
# from a checkout where it ran must not ship them.
exclude = [
    "agents_gym_core.agents.hotpotqa.evaluations*",
    "agents_gym_core.agents.hover.evaluations*",
    "agents_gym_core.agents.aime_2025_agent.evaluations*",
    "agents_gym_core.agents.livebench_math.evaluations*",
    "agents_gym_core.agents.ifbench.evaluations*",
    "agents_gym_core.agents.papillon.evaluations*",
]

[tool.setuptools.package-data]
agents_gym_core = [
    "**/*.json", "**/*.yaml", "**/*.md", "**/*.csv", "**/*.xlsx", "**/*.pdf", "**/*.db", "**/*.ipynb",
]

[tool.setuptools.exclude-package-data]
agents_gym_core = [
    "agents/hotpotqa/evaluations/*/*",
    "agents/hover/evaluations/*/*",
    "agents/aime_2025_agent/evaluations/*/*",
    "agents/livebench_math/evaluations/*/*",
    "agents/ifbench/evaluations/*/*",
    "agents/papillon/evaluations/*/*",
    # MIPROv2 demos that `gym init` fills with benchmark text
    "agents/aime_2025_agent/prompts/miprov2/predict.json",
    "agents/livebench_math/prompts/miprov2/predict.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "*.md",  # ruff 0.16 also checks Python code blocks in Markdown
    # Written by the public-benchmark agents' init.py (gitignored). Class and field names
    # are referenced by evaluatorSchema / DSPy signatures, so they are not renamed.
    "src/agents_gym_core/agents/hotpotqa/evaluations",
    "src/agents_gym_core/agents/hover/evaluations",
    "src/agents_gym_core/agents/aime_2025_agent/evaluations",
    "src/agents_gym_core/agents/livebench_math/evaluations",
    "src/agents_gym_core/agents/ifbench/evaluations",
    "src/agents_gym_core/agents/papillon/evaluations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length is left to ruff format

[tool.pyright]
# gepa-artifact is a submodule put on sys.path at runtime (agents_gym_core.gepa_artifact).
extraPaths = ["gepa-artifact"]
exclude = [
    "**/__pycache__",
    "**/.git",
    "**/.venv/",
    "gepa-artifact",
    # init-generated, gitignored evaluators of the public-benchmark agents (see [tool.ruff])
    "src/agents_gym_core/agents/hotpotqa/evaluations",
    "src/agents_gym_core/agents/hover/evaluations",
    "src/agents_gym_core/agents/aime_2025_agent/evaluations",
    "src/agents_gym_core/agents/livebench_math/evaluations",
    "src/agents_gym_core/agents/ifbench/evaluations",
    "src/agents_gym_core/agents/papillon/evaluations",
    ".ipynb_checkpoints",
]
ignore = ["**/*_pb2.py", "**/*.#*.py"]
deprecateTypingAliases = true
reportDuplicateImport = true
reportFunctionMemberAccess = "error"
reportImportCycles = "error"
reportIncompatibleMethodOverride = "error"
reportInvalidStringEscapeSequence = "error"
reportMatchNotExhaustive = "error"
reportMissingImports = "error"
reportPropertyTypeMismatch = "error"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false
reportCallInDefaultInitializer = false
reportUnusedCallResult = false
reportMissingTypeStubs = false
reportUntypedBaseClass = "error"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
reportMissingParameterType = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Deprecations raised inside third-party packages (and the gepa-artifact submodule), not by this code.
filterwarnings = [
    "ignore:uipath.platform.common.constants is deprecated:FutureWarning",
    "ignore:Importing Send from langgraph.constants is deprecated",
    "ignore:'click.utils.get_(binary|text)_stream' is deprecated:DeprecationWarning",
    '''ignore:invalid escape sequence '\\/':SyntaxWarning''',
]

[tool.uv]
build-constraint-dependencies = [
    { requirement = "setuptools==84.1.0", hashes = ["sha256:5231689c6ac8156cd155cfb98c3fd6fb252c3e7e9bd3d78b64d3c55f132624c9"] },
]
require-build-hashes = true
preview-features = ["build-dependency-hashes"]
# Apply a two-day publication cooldown before dependency releases are eligible for resolution.
exclude-newer = "2 days"

# Advisories with no fixed release yet (upgrade once one ships):
# - chromadb 1.5.9: the advisories are in the Chroma HTTP server (code injection through the
#   collections API, tenant authorization). Chroma is used here only as an embedded local
#   store (langchain_chroma with persist_directory); no server is started.
# - diskcache 5.6.3 (via dspy's cache): unpickles cache entries, so only someone who can
#   already write the local cache directory can exploit it.
#
# LiteLLM 1.109 is the reviewed release line, with filelock 4.x support. Its lower bound
# excludes the malicious releases covered by GHSA-92x9-889m-jgmw. Review new release lines
# against the advisory database before raising the cap.
constraint-dependencies = [
    "soupsieve>=4,<5",
    "filelock>=4.2.1,<5",
    # Reviewed companion tuple, not upstream exact-version requirements.
    # Move these pins together with the artifact audit when updating dependencies.
    "boto3==1.43.117",
    "botocore==1.43.117",
    "s3transfer==0.19.3",
    "hf-xet==1.7.0",
    "langchain>=1.3.9",
    "langgraph-sdk>=0.4.4",
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    "setuptools>=84.1.0",
    "black>=26.10.1,<27",
    "pyasn1>=0.6.5",
    "pyarrow>=23.0.1",
    "accelerate>=1.15.0",
    "aiohttp>=3.14.1,<3.15",
    "anthropic<0.126",
    "bm25s<0.3.4",
    "datamodel-code-generator>=0.81.0",
    "jupyter-server>=2.20.0,<2.21",
    "jupyterlab>=4.5.9,<4.6",
    "jsonschema>=4.26,<5",
    "langsmith>=0.8.18",
    "litellm>=1.109.0,<1.110",
    "lxml>=6.1,<6.2",
    "openinference-instrumentation>=0.1.62,<0.1.63",
    "openinference-instrumentation-langchain>=0.1.75,<0.1.76",
    "openinference-semantic-conventions>=0.1.36,<0.1.37",
    "notebook>=7.5.6,<7.6",
    "pillow>=13.0.0",
    "pygments>=2.20,<2.21",
    "pyopenssl>=26,<27",
    "pydantic-settings>=2.14.2,<2.15",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.31,<0.0.32",
    "requests>=2.33,<2.34",
    "urllib3>=2.8.0",
    "tornado>=6.6,<6.7",
    "ujson>=5.13.0,<5.14",
    "bleach>=6.4.0,<6.5",
    "pyjwt>=2.15.0,<3",
    "msgpack>=1.2.1,<1.3",
    "idna>=3.15,<4",
    "python-engineio>=4.13.2,<4.14",
    "python-socketio>=5.16.2,<5.17",
    "starlette>=1.3.1,<1.4",

]

# Torch: CUDA 13.0 wheels on Linux (needs NVIDIA driver >= 580; older drivers
# fall back to CPU), CPU wheels elsewhere.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
