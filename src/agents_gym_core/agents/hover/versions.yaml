# @package _global_
#
# GEPA's splits: train 150, val 300, test 300. The base version (agent.yaml) loads all three;
# these versions load one, e.g.
#   uv run gym eval --agents hover:test

train:
  version: train
  agent:
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-hover_train.json

val:
  version: val
  agent:
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-hover_val.json

test:
  version: test
  agent:
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-hover_test.json

gepa__gpt-4.1-mini:
  version: gepa__gpt-4.1-mini
  agent:
    user_prompt: "core::prompts/gepa__gpt-4.1-mini/user_prompt.md"
    signature_prompts:
      summarize1: "core::prompts/gepa__gpt-4.1-mini/summarize1.md"
      summarize2: "core::prompts/gepa__gpt-4.1-mini/summarize2.md"
      create_query_hop2: "core::prompts/gepa__gpt-4.1-mini/create_query_hop2.md"
      create_query_hop3: "core::prompts/gepa__gpt-4.1-mini/create_query_hop3.md"
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-hover_train.json
      - core::evaluations/eval-sets/evaluation-set-hover_val.json
      - core::evaluations/eval-sets/evaluation-set-hover_test.json

