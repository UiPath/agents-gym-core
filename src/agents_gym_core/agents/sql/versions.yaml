# @package _global_

train:
  version: train
  agent:
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-sql_train.json

test:
  version: test
  agent:
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-sql_test.json

baseline:
  version: baseline
  agent:
    system_prompt: core::prompts/baseline/system_prompt.md
    user_prompt: core::prompts/baseline/user_prompt.md

baseline-train:
  version: baseline-train
  agent:
    system_prompt: core::prompts/baseline/system_prompt.md
    user_prompt: core::prompts/baseline/user_prompt.md
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-sql_train.json

baseline-test:
  version: baseline-test
  agent:
    system_prompt: core::prompts/baseline/system_prompt.md
    user_prompt: core::prompts/baseline/user_prompt.md
    evaluation_sets:
      - core::evaluations/eval-sets/evaluation-set-sql_test.json

# The ReAPO paper's prompts
reapo__gpt-5:
